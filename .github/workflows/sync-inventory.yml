name: Sync inventory from Google Sheet

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync inventory into index.html
        run: python3 .github/scripts/sync_inventory.py

      - name: Commit if changed
        run: |
          git config user.name "lot-one-sync"
          git config user.email "lot-one-sync@users.noreply.github.com"
          git add index.html products.json
          git diff --staged --quiet || (git commit -m "Auto-sync inventory from Google Sheet" && git push)
